name: ROM compatibility report
description: Report how MobileClaw behaves on a specific Android device or ROM.
title: "[ROM]: "
labels: ["compatibility", "android-rom"]
body:
  - type: input
    id: device
    attributes:
      label: Device model
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: ROM name and version
      placeholder: MIUI / HyperOS / ColorOS / One UI / Pixel / LineageOS ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MobileClaw version or commit
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions and helpers
      options:
        - label: AccessibilityService enabled
        - label: Screenshot permission granted
        - label: Notification permission granted
        - label: Overlay permission granted
        - label: Battery optimization disabled
        - label: VPN permission granted
        - label: Root available
        - label: Shizuku available
        - label: ADB helper used
  - type: checkboxes
    id: features
    attributes:
      label: Feature results
      options:
        - label: Screen XML reading works
        - label: Screenshot capture works
        - label: Tap gesture works
        - label: Scroll gesture works
        - label: Text input works
        - label: App launch works
        - label: Virtual display launch works
        - label: Background screenshot works
        - label: VPN start/stop works
        - label: WebView mini app works
        - label: AI Page rendering works
  - type: textarea
    id: notes
    attributes:
      label: Notes and reproduction
      description: Include task prompts, expected behavior, actual behavior, and logs with private data removed.
    validations:
      required: true

