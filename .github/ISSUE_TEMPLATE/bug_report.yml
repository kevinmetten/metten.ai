name: Bug report
description: Report a reproducible MobileClaw bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the task prompt when relevant.
      placeholder: |
        1. Open ...
        2. Grant ...
        3. Ask MobileClaw ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MobileClaw version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
    validations:
      required: false
  - type: input
    id: android
    attributes:
      label: Android version and ROM
    validations:
      required: false
  - type: checkboxes
    id: areas
    attributes:
      label: Area
      options:
        - label: AccessibilityService / screen reading
        - label: Screenshot / VLM
        - label: Gesture or text input
        - label: Dynamic skills
        - label: Python or shell execution
        - label: WebView mini app
        - label: AI Page
        - label: VPN / proxy
        - label: Local or LAN API server
        - label: Model prompt, memory, or tool observations
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Remove API keys, tokens, proxy credentials, phone numbers, private URLs, and personal screenshots.

